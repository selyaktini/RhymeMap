name: Set up Python for RhymeMapper
description: >
  Install Python, the project's dependencies and the NLTK corpora. Kept in one
  place because the install is not obvious: g2p_en cannot be installed normally,
  and when that workaround changed it had to be edited in three files at once.
  One of them was missed, and CI broke on a Python version the others did not
  cover.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"
  extras:
    description: Extra pip packages (for example "ruff")
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Install dependencies
      shell: bash
      # g2p_en is installed with --no-deps: it declares `distance`, whose
      # setup.py uses an attribute setuptools removed in v60, and it never
      # imports it. Pinning setuptools below 60 to work around that broke pip
      # itself on 3.12 ("Cannot import 'setuptools.build_meta'"), which is what
      # this replaces. g2p_en's real dependencies are in requirements.txt.
      run: |
        python -m pip install --upgrade pip wheel
        python -m pip install -r requirements.txt ${{ inputs.extras }}
        python -m pip install --no-deps g2p_en

    - name: Cache NLTK data
      uses: actions/cache@v4
      with:
        path: ~/nltk_data
        # Keyed on the fetching script: change what is downloaded and the cache
        # is rebuilt instead of silently serving the old corpora.
        key: nltk-${{ runner.os }}-${{ hashFiles('scripts/fetch_nltk_data.py') }}
        restore-keys: nltk-${{ runner.os }}-

    - name: Fetch NLTK corpora
      shell: bash
      run: python -m scripts.fetch_nltk_data
